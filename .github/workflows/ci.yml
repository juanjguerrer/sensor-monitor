name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: ./backend

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      JWT_SECRET: 51c12c9c09f9dd76ac451aa7d9caa169eb7752067720655999ea5665ffd15ff7
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Checkout the code
      - uses: actions/checkout@v7
      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      # Install the project's dependencies
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run database migrations
        run: npm run migrate:up
      # Seed the database
      - name: Seed the database
        run: psql "$DATABASE_URL" -f scripts/seed_base.sql

      - name: Verify seed is idempotent
        run: psql "$DATABASE_URL" -f scripts/seed_base.sql
      # Type check the project
      - name: Build the project
        run: npx tsc --noEmit
      # Run tests
      - name: Run tests
        run: npm test
      - name: Build docker image
        run: docker build -t my-image:latest .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test -- --watch=false
      - name: Build the project
        run: npm run build
      - name: Build docker image
        run: docker build -t sensor-monitor-frontend:latest .
# Implement caching for Docker layers to speed up builds in future runs if needed. Uncomment the following steps if you want to enable Docker caching.
