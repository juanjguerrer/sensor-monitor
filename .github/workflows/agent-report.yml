name: Sensor report

on:
  schedule:
    # 07:00 UTC every day. Cron here is always UTC.
    - cron: '0 7 * * *'
  # Lets you run it on demand from the Actions tab.
  workflow_dispatch:

defaults:
  run:
    working-directory: ./agent

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GRAPHQL_URL: ${{ secrets.GRAPHQL_URL }}
      SENSOR_USERNAME: ${{ secrets.SENSOR_USERNAME }}
      SENSOR_PASSWORD: ${{ secrets.SENSOR_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: claude-opus-5
      MAX_TOKENS: '10000'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ./agent/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run agent
        run: |
          python -m sensor_agent "Write a health report for all sensors." \
            | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
