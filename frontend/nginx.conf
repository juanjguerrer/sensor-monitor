server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API. `environment.ts` sets graphqlUrl to the relative "/graphql", which is
  # only true because of this block. The trailing slash on proxy_pass strips the
  # /graphql prefix, since the backend serves GraphQL at its root.
  location /graphql {
    proxy_pass http://backend:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The builder hashes every .js and .css filename, so their contents can never
  # change under a given name — safe to cache forever.
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached: it is what points at the hashed bundles, so a
  # stale copy would keep loading the previous deploy's JavaScript.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback. Without this, /sensors/3 asks nginx for a file that does not
  # exist and gets a 404 — deep links and refresh break, while dev works fine
  # because `ng serve` answers every path with index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
